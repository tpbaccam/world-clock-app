<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.31.0/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.4/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock ⏰</h1>

      <select>
        <option value="">Select a city</option>
        <option value="">Singapore</option>
        <option value="">Lagos</option>
        <option value="">Santiago</option>
      </select>

      <div class="city" id="los-angeles">
        <div>
          <h2>Los Angeles</h2>
          <div class="date">September 27, 2026</div>
        </div>
        <div class="time"><small>2:39:05 PM</small></div>
      </div>
      <div class="city" id="singapore">
        <div>
          <h2>Singapore</h2>
          <div class="date">September 27, 2026</div>
        </div>
        <div class="time"><small>2:39:05 PM</small></div>
      </div>
    </div>
    <footer>
      This project was coded by <strong>Tristine Baccam </strong>and is open
      sourced on
      <a href="https://github.com/tpbaccam/world-clock-app" target="_blank"
        >GitHub</a
      >.
    </footer>
    <script src="javascript/index.js"></script>
  </body>
</html>
